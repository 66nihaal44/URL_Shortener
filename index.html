<!DOCTYPE html>
<html lang="en">
<head>
    <title>URL Shortener</title>
    <style> 
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        h1{
            text-align: center;
        }
        .display{
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>URL Shortener</h1>
        <form id="urlSubmit">
          <label> Type URL here</label>
          <br/>
          <br/>
          <input type="url" name="originalUrl" value="https://" maxlength="64" required />
          <br/>
          <br/>
          <button type="button" id="advanced">Advanced Options</button>
          <div style="display:none;" id="options">
          <br/>
          <label> Type Custom URL</label>
          <br/>
          <br/>
          <input type="text" placeholder="custom-url" name="customUrl" pattern="[A-Za-z0-9_-]*" />
          <br/>
          <br/>
          <label> Type Link Expiration Date</label>
          <br/>
          <br/>
          <input type="date" name="expiryDate" />
          <br/>
          <br/>
          <label> Type Password</label>
          <br/>
          <br/>
          <input type="text" name="password"/>
          </div>
          <br/>
          <br/>
          <button type="submit">Generate Shortened URL</button>
        </form>
        <br/>
        <div class="display" id="urlDisplay">Shortened URL shows here.</div>
    </div>
</body>
<script>
  const urlForm = document.getElementById("urlSubmit");
  const urlDisplay = document.getElementById("urlDisplay");
  const advanced = document.getElementById("advanced");
  const options = document.getElementById("options");
  const expiryDate = urlForm.elements["expiryDate"];
  const domainUrl = "https://url-shortener-g54n.onrender.com";
  expiryDate.min = new Date().toLocaleDateString('fr-ca');
  advanced.addEventListener("click", function () {
      if(options.style.display === "none"){
          options.style.display = "block";
      }
      else {
          options.style.display = "none";
      }
  });
  urlForm.addEventListener("submit", async (a) => {
    a.preventDefault();
    const originalUrl = urlForm.elements["originalUrl"];
    const customUrl = urlForm.elements["customUrl"];
    const password = urlForm.elements["password"];
    /*console.log(customUrl.validity);
    if(!customUrl.checkValidity()){
        customUrl.reportValidity();
        return;
    }*/
    try {
        const res = await fetch(domainUrl + "/shorten", {
            // NEW FEATURE: MAKE ERROR MESSAGES VISIBLE ON FRONTEND
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                url: originalUrl.value,
                customUrl: customUrl.value ?? null,
                // Plan: account for Timezones 
                expiryDate: expiryDate.value ?? null,
                password: password.value ?? null,
            })
        });
        urlDisplay.textContent = "Generating...";
        if(!res.ok){
            var backend;
            try{
            backendData = await res.json();
            }
            catch{
                backendData = {};
            }
            throw new Error(backendData.error || `HTTP error ${res.status}`);
        }
        const newUrl = await res.json();
        if(!newUrl.short_url){
            throw new Error("No URL recieved");
        }
        console.log("response: ", newUrl);
        urlDisplay.innerHTML = `<a href="${newUrl.short_url}" target="_blank">${newUrl.short_url}</a>`;
    }
    catch(err){
        console.error("Error during generation: ", err.message)
        urlDisplay.textContent = `Error during generation: ${err.message}`
    }
  });
</script>
</html>
