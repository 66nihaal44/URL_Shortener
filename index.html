<!DOCTYPE html>
<html lang="en">
<head>
    <title>URL Shortener</title>
    <style>
        .container{
            /* margin-left: auto;
            margin-right: auto; */
            align-items: center;
        }
        h1{
            text-align: center;
        }
        form{
            text-align: center;
        }
        .display{
            margin-top: 1rem;
            text-align: center;
        }
        label, input{
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>URL Shortener</h1>
        <form id="urlSubmit">
          <label> Type URL here</label>
          <input type="text" name="originalUrl" required />
          <label> Type Custom URL (Optional)</label>
          <input type="text" placeholder="custom-url" name="customUrl" />
          <button type="submit">Generate Shortened URL</button>
        </form>
        <div class="display" id="urlDisplay">Shortened URL shows here.</div>
    </div>
</body>
<script>
  const urlForm = document.getElementById("urlSubmit");
  const urlDisplay = document.getElementById("urlDisplay");
  const domain_url = "https://url-shortener-g54n.onrender.com";
  urlForm.addEventListener("submit", async (a) => {
    a.preventDefault();
    const textInput = urlForm.elements["originalUrl"];
    try {
        const res = await fetch(domain_url + "/shorten", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                url: textInput.value
            })
        });
        urlDisplay.textContent = "Generating...";
        if(!res.ok){
            var backend;
            try{
            backendData = await res.json();
            }
            catch{
                backendData = {};
            }
            throw new Error(backendData.error || `HTTP error ${res.status}`);
        }
        const newUrl = await res.json();
        if(!newUrl.short_url){
            throw new Error("No URL recieved");
        }
        console.log("response: ", newUrl);
        urlDisplay.innerHTML = `<a href="${newUrl.short_url}" target="_blank">${newUrl.short_url}</a>`;
    }
    catch(err){
        console.error("Error during generation: ", err.message)
    }
  });
</script>
</html>
